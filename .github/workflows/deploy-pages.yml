name: Deploy Rift Architect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate JSON data from Excel
        run: npm run generate:data

      - name: Prepare Pages artifact
        run: |
          mkdir -p .site
          cp index.html .site/
          cp version.json .site/
          cp service-worker.js .site/
          cp manifest.webmanifest .site/
          cp Draft\ Pool.xlsx .site/
          cp -R css .site/
          cp -R js .site/
          cp -R assets .site/
          cp -R data .site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
