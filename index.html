<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Rift Architect</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Rift Architect</p>
          <h1>Draft y análisis de composiciones</h1>
          <p class="subtitle">Carga la base del Excel y construye tu draft por roles.</p>
        </div>
        <button id="refreshBtn" class="ghost-btn" type="button">Recargar datos</button>
      </header>

      <main class="layout">
        <section class="panel panel--left">
          <div class="panel-title-row">
            <h2>Roles</h2>
            <span id="statusBadge" class="status">Cargando…</span>
          </div>
          <div id="roleTabs" class="role-tabs"></div>
          <label class="search">
            <span>Buscar campeón</span>
            <input id="searchInput" type="search" placeholder="Aatrox, Jinx, Lulu…" />
          </label>
          <div id="championList" class="champion-list"></div>
        </section>

        <section class="panel panel--center">
          <div class="panel-title-row">
            <h2>Composición</h2>
            <button id="clearBtn" class="ghost-btn" type="button">Limpiar todo</button>
          </div>
          <div id="compositionGrid" class="composition-grid"></div>

          <article class="details-card">
            <h3 id="detailTitle">Selecciona un campeón</h3>
            <p id="detailMeta" class="meta"></p>
            <div class="detail-columns">
              <div>
                <h4>Fortalezas</h4>
                <ul id="detailStrengths"></ul>
              </div>
              <div>
                <h4>Debilidades</h4>
                <ul id="detailWeaknesses"></ul>
              </div>
            </div>
          </article>
        </section>

        <aside class="panel panel--right">
          <div class="panel-title-row">
            <h2>Análisis</h2>
          </div>
          <div id="analysisSummary" class="analysis-summary"></div>
          <div id="scoreBars" class="score-bars"></div>
          <div id="recommendations" class="recommendations"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
