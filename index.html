<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Rift Architect</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/v2.css" />
    <link rel="stylesheet" href="./css/v2_patch.css" />
    <link rel="stylesheet" href="./css/fixes.css" />
    <link rel="stylesheet" href="./css/analysis.css" />
    <link rel="stylesheet" href="./css/analysis-v2.css" />
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-brand">
          <h1 class="app-title">Rift Architect</h1>
        </div>
        <div class="header-actions">
          <span id="statusBadge" class="status">Cargando…</span>
          <button id="refreshBtn" class="ghost-btn" type="button">Actualizar</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel panel--main">
          <div class="panel-title-row">
            <h2>Tu composición</h2>
            <button id="clearBtn" class="ghost-btn" type="button">Limpiar</button>
          </div>

          <div id="compositionGrid" class="composition-grid"></div>

          <div class="summary-card">
            <div id="analysisSummary" class="analysis-summary" aria-live="polite"></div>
            <div id="recommendations" class="recommendation-list"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="pickerBackdrop" class="picker-backdrop is-hidden" aria-hidden="true">
      <section class="picker-modal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <div class="picker-header">
          <div>
            <p id="pickerRoleLabel" class="eyebrow"></p>
            <h2 id="pickerTitle">Elegir campeón</h2>
          </div>
          <button id="closePickerBtn" class="ghost-btn" type="button">Cerrar</button>
        </div>

        <label class="search">
          <span class="sr-only">Buscar campeón</span>
          <input id="searchInput" type="search" placeholder="Buscar campeón…" autocomplete="off" />
        </label>

        <div id="championList" class="champion-list"></div>
        <p id="pickerHint" class="picker-hint"></p>
      </section>
    </div>

    <script type="module" src="./js/bootstrap.js"></script>
    <script type="module" src="./js/app-v2.js"></script>
    <script type="module" src="./js/v2_patch.js"></script>
    <script type="module" src="./js/analysis-panel.js"></script>
  </body>
</html>
