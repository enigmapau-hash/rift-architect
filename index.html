<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Rift Architect</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Rift Architect</p>
          <h1>Draft rápido</h1>
          <p class="subtitle">Elige tus 5 campeones y revisa solo lo importante.</p>
        </div>
        <div class="header-actions">
          <span id="statusBadge" class="status">Cargando…</span>
          <button id="refreshBtn" class="ghost-btn" type="button">Actualizar</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel panel--main">
          <div class="panel-title-row">
            <h2>Tu composición</h2>
            <button id="clearBtn" class="ghost-btn" type="button">Limpiar</button>
          </div>

          <div id="compositionGrid" class="composition-grid"></div>

          <div class="summary-card">
            <div class="panel-title-row compact">
              <h3>Resumen rápido</h3>
              <span id="activeRoleLabel" class="status"></span>
            </div>
            <div id="analysisSummary" class="analysis-summary" aria-live="polite"></div>
            <div id="recommendations" class="recommendation-list"></div>
          </div>

          <div class="selector-card">
            <div class="panel-title-row compact">
              <h3>Elegir campeón</h3>
              <span class="hint">Toca un rol y luego un campeón</span>
            </div>
            <div id="roleTabs" class="role-tabs"></div>
            <label class="search">
              <span class="sr-only">Buscar campeón</span>
              <input id="searchInput" type="search" placeholder="Buscar campeón…" />
            </label>
            <div id="championList" class="champion-list"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
