<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Rift Architect v2</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app-v2" class="app-shell">
      <header class="app-shell__header">
        <div>
          <p class="app-shell__eyebrow">Rift Architect v2</p>
          <h1 class="app-shell__title">Executive Summary</h1>
        </div>
        <span class="app-shell__badge">Sprint 0.1</span>
      </header>

      <main class="app-shell__main">
        <section class="analysis-panel" aria-label="Analysis Panel">
          <div id="dashboard-root" class="dashboard-root">
            <article class="card">
              <header class="card__header">
                <p class="card__eyebrow">Executive Summary</p>
                <h2 class="card__title">Placeholder</h2>
              </header>
              <div class="card__body">
                <p class="card__text">La nueva interfaz mínima arrancará aquí.</p>
              </div>
            </article>
          </div>
        </section>
      </main>

      <footer class="app-shell__footer">
        <span>Minimal v2 UI</span>
        <span>v132</span>
      </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
